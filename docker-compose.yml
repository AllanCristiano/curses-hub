# HCode Hub — ambiente local reproduzível.
#
#   docker compose up -d                       # PostgreSQL + API (migrations automáticas)
#   docker compose up -d postgres              # só o banco (API rodando com `npm run start:dev`)
#   docker compose --profile test up -d        # + banco de testes (porta 5433)
#   docker compose --profile tools up -d       # + pgAdmin (http://localhost:5050)
#
# Todas as variáveis têm valor padrão para desenvolvimento; sobrescreva-as via arquivo .env.

name: hcode-hub

services:
  postgres:
    image: postgres:16-alpine
    container_name: hcode-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hcode}
      POSTGRES_DB: ${POSTGRES_DB:-hcode_hub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hcode-hub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hcode}:${POSTGRES_PASSWORD:-hcode}@postgres:5432/${POSTGRES_DB:-hcode_hub}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      PAGINATION_MAX_LIMIT: ${PAGINATION_MAX_LIMIT:-100}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      AUTH_THROTTLE_TTL_SECONDS: ${AUTH_THROTTLE_TTL_SECONDS:-60}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-10}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-change-me-webhook}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "${API_PORT:-3000}:3000"

  # Banco isolado e descartável para os testes de integração/E2E (perfil "test").
  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    container_name: hcode-hub-postgres-test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hcode}
      POSTGRES_DB: hcode_hub_test
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hcode_hub_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Interface web opcional para inspecionar o banco (perfil "tools").
  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:8
    container_name: hcode-hub-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hcode.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
